# Deployment path: GitHub Actions -> Tailscale -> Coolify
name: Deploy glineze to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: glineze-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment configuration
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TS_TAGS: ${{ secrets.TS_TAGS }}
        run: |
          : "${COOLIFY_URL:?Set the COOLIFY_URL repository or production environment secret}"
          : "${COOLIFY_APP_UUID:?Set the COOLIFY_APP_UUID repository or production environment secret}"
          : "${TS_TAGS:?Set the TS_TAGS repository or production environment secret}"

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ secrets.TS_TAGS }}

      - name: Trigger glineze deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            "${COOLIFY_URL}/api/v1/deploy" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"uuid\":\"${COOLIFY_APP_UUID}\",\"force\":false}"
