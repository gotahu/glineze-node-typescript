# Deployment path: GitHub Actions -> Tailscale -> Coolify
name: Deploy glineze to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: glineze-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify Coolify application
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment configuration
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TS_TAGS: ${{ secrets.TS_TAGS }}
          GLINEZE_PUBLIC_URL: ${{ vars.GLINEZE_PUBLIC_URL }}
        run: |
          : "${COOLIFY_URL:?Set the COOLIFY_URL repository or production environment secret}"
          : "${COOLIFY_APP_UUID:?Set the COOLIFY_APP_UUID repository or production environment secret}"
          : "${TS_TAGS:?Set the TS_TAGS repository or production environment secret}"
          : "${GLINEZE_PUBLIC_URL:?Set the GLINEZE_PUBLIC_URL repository or production environment variable}"

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ secrets.TS_TAGS }}

      - name: Trigger glineze deployment
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --output "${RUNNER_TEMP}/coolify-deployment.json" \
            --request POST \
            "${COOLIFY_URL}/api/v1/deploy" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"uuid\":\"${COOLIFY_APP_UUID}\",\"force\":false}"

          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          response = json.loads((Path(os.environ['RUNNER_TEMP']) / 'coolify-deployment.json').read_text())
          deployments = response.get('deployments', [])
          if len(deployments) != 1:
              raise SystemExit('Expected exactly one Coolify deployment.')
          deployment_uuid = deployments[0].get('deployment_uuid', '')
          if not re.fullmatch(r'[A-Za-z0-9_-]+', deployment_uuid):
              raise SystemExit('Coolify did not return a valid deployment UUID.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'deployment_uuid={deployment_uuid}\n')
          print(f'Queued deployment: {deployment_uuid}')
          PYTHON

      - name: Verify public page, admin assets and application health
        env:
          GLINEZE_PUBLIC_URL: ${{ vars.GLINEZE_PUBLIC_URL }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          public_url = urllib.parse.urlsplit(os.environ['GLINEZE_PUBLIC_URL'])
          if public_url.scheme not in ('http', 'https') or not public_url.netloc or public_url.username or public_url.password:
              raise SystemExit('GLINEZE_PUBLIC_URL must be a valid HTTP URL without credentials.')
          origin = urllib.parse.urlunsplit((public_url.scheme, public_url.netloc, '', '', ''))
          revision = os.environ['GITHUB_SHA']
          public_headers = {'User-Agent': 'Glineze-Deployment-Verifier/1.0', 'Cache-Control': 'no-cache'}
          source_root = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{revision}/src/services/"
          for attempt in range(6):
              try:
                  expected_digests = {}
                  for name, path in [('admin', 'admin/adminStyles.ts'), ('admin-client', 'admin/adminClient.ts'), ('public', 'webapi/statusStyles.ts')]:
                      with urllib.request.urlopen(source_root + path, timeout=30) as response:
                          source = response.read().decode('utf-8')
                      expected_asset = source.split('String.raw`', 1)[1].rsplit('`;', 1)[0].encode('utf-8')
                      expected_digests[name] = hashlib.sha256(expected_asset).hexdigest()
                  break
              except (urllib.error.HTTPError, urllib.error.URLError):
                  print('Waiting for the revision source to be available.')
                  time.sleep(10)
          else:
              raise SystemExit('Cannot retrieve the page assets for the deployed revision.')

          for attempt in range(90):
              try:
                  health_request = urllib.request.Request(origin + '/health', headers=public_headers)
                  with urllib.request.urlopen(health_request, timeout=15) as response:
                      healthy = response.status == 200
                  asset_request = urllib.request.Request(
                      origin + '/admin/assets/admin.css?v=' + revision,
                      headers=public_headers,
                  )
                  with urllib.request.urlopen(asset_request, timeout=15) as response:
                      actual_digest = hashlib.sha256(response.read()).hexdigest()
                  client_request = urllib.request.Request(
                      origin + '/admin/assets/admin.js?v=' + revision,
                      headers=public_headers,
                  )
                  with urllib.request.urlopen(client_request, timeout=15) as response:
                      client_digest = hashlib.sha256(response.read()).hexdigest()
                  public_request = urllib.request.Request(origin + '/?v=' + revision, headers=public_headers)
                  with urllib.request.urlopen(public_request, timeout=15) as response:
                      public_html = response.read().decode('utf-8')
                  public_css = public_html.partition('<style>')[2].partition('</style>')[0].encode('utf-8')
                  public_digest = hashlib.sha256(public_css).hexdigest()
                  if healthy and actual_digest == expected_digests['admin'] and client_digest == expected_digests['admin-client'] and public_digest == expected_digests['public']:
                      print('Application health, public page and admin assets verified for commit ' + revision)
                      print('Public URL: ' + origin)
                      print('Admin URL: ' + origin + '/admin')
                      break
                  print(f'Waiting for the new public page and admin assets (attempt {attempt + 1}/90).')
              except (urllib.error.HTTPError, urllib.error.URLError):
                  print(f'Waiting for application health and admin assets (attempt {attempt + 1}/90).')
              time.sleep(10)
          else:
              raise SystemExit('The application did not serve the expected public page and admin assets with a healthy response.')
          PYTHON
