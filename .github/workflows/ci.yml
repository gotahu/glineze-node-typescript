name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DISCORD_BOT_TOKEN: test-only-token
      DISCORD_RELAY_WEBHOOK: https://example.com/webhook
      NOTION_TOKEN: test-only-notion-token
      NOTION_CONFIGURATION_DATABASEID: test-database-id
      SESAME_ENABLED: 'false'
      NOTION_AUTOMATION_ENABLED: 'false'
      ADMIN_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 23.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
