name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    # Repository policy only permits selected actions, so keep this job action-free.
    container: node:23.4.0-bookworm
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DISCORD_BOT_TOKEN: test-only-token
      DISCORD_RELAY_WEBHOOK: https://example.com/webhook
      NOTION_TOKEN: test-only-notion-token
      NOTION_CONFIGURATION_DATABASEID: test-database-id
      SESAME_ENABLED: 'false'
      NOTION_AUTOMATION_ENABLED: 'false'
      ADMIN_ENABLED: 'false'

    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
